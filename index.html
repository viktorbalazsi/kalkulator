<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#061814">
    <title>tk accelis Materials Hungary Zrt. | Mobil Acélkatalógus & Súlykalibrátor</title>
    <style>
        :root {
            --tk-deep-green: #0a2923;
            --tk-dark-surface: #0e352e;
            --tk-active-green: #4afb86;
            --tk-accent-orange: #ff8e14;
            --tk-warm-white: #f2ede7;
            --tk-warm-muted: #b8c4bf;
            --tk-border: #1d5248;
            --tk-slot-bg: #071e19;
            --tk-bg: #061814;
            --tk-panel: #08211c;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 7px;
            --gap: 14px;
        }

        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            padding: 10px;
            background: radial-gradient(1200px 600px at 50% -10%, #0c3a31 0%, var(--tk-bg) 60%) fixed, var(--tk-bg);
            color: var(--tk-warm-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.35;
        }
        button, input { font: inherit; }

        /* ===== Keret ===== */
        .app {
            max-width: 600px;
            margin: 0 auto;
            background: var(--tk-deep-green);
            border: 1px solid var(--tk-border);
            border-top: 6px solid var(--tk-active-green);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* ===== Fejléc ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            background: linear-gradient(180deg, #07221d 0%, #0a2923 100%);
            border-bottom: 1px solid var(--tk-border);
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-mark {
            flex: none;
            width: 38px; height: 38px;
            border-radius: 10px;
            background: rgba(74, 251, 134, 0.12);
            border: 1px solid rgba(74, 251, 134, 0.35);
            display: grid; place-items: center;
        }
        .brand-name { font-size: 17px; font-weight: 900; color: var(--tk-active-green); letter-spacing: -0.2px; }
        .brand-sub { font-size: 11px; color: var(--tk-warm-muted); }
        .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .badge {
            font-size: 10px; font-weight: 750;
            color: var(--tk-active-green);
            background: rgba(74, 251, 134, 0.15);
            border: 1px solid rgba(74, 251, 134, 0.3);
            padding: 4px 10px; border-radius: 6px;
            white-space: nowrap;
        }
        .lang-switch { display: flex; border: 1px solid var(--tk-border); border-radius: 7px; overflow: hidden; }
        .lang-switch button {
            background: #061e19; color: var(--tk-warm-muted);
            border: none; padding: 5px 10px;
            font-size: 10px; font-weight: 800; cursor: pointer;
            transition: background .15s, color .15s;
        }
        .lang-switch button + button { border-left: 1px solid var(--tk-border); }
        .lang-switch button:hover:not(.active) { color: var(--tk-warm-white); }
        .lang-switch button.active { background: var(--tk-active-green); color: #061814; }

        /* ===== Fülek ===== */
        .nav { padding: 14px 16px 0; }
        .group-tabs, .sub-tabs {
            display: flex; gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .group-tabs::-webkit-scrollbar, .sub-tabs::-webkit-scrollbar { display: none; }
        .group-tabs { padding-bottom: 8px; }
        .sub-tabs { padding-bottom: 12px; border-bottom: 1px solid var(--tk-border); }
        .group-btn, .tab-btn {
            flex: none;
            background: #061e19;
            border: 1.5px solid var(--tk-border);
            padding: 8px 14px;
            font-size: 12px; font-weight: 700;
            color: var(--tk-warm-white);
            border-radius: 8px;
            white-space: nowrap;
            cursor: pointer;
            transition: border-color .15s, background .15s, box-shadow .15s;
        }
        .group-btn { font-size: 13px; }
        .group-btn:hover:not(.active), .tab-btn:hover:not(.active) { border-color: rgba(74, 251, 134, 0.6); }
        .group-btn.active, .tab-btn.active {
            background: var(--tk-active-green);
            color: #061814;
            border-color: var(--tk-active-green);
            box-shadow: 0 4px 12px rgba(74, 251, 134, 0.3);
        }

        /* ===== Fő elrendezés ===== */
        .layout { display: grid; gap: 18px; padding: 14px 16px 18px; }
        .card {
            background: var(--tk-panel);
            border: 1.5px solid var(--tk-border);
            border-radius: 12px;
            padding: 16px;
            min-width: 0;
        }
        .panel {
            background: var(--tk-dark-surface);
            border: 1px solid var(--tk-border);
            border-radius: var(--radius-md);
            padding: 14px;
            min-width: 0;
        }

        /* Kalkulátor */
        .calc { display: grid; gap: var(--gap); }
        .calc-head { border-bottom: 1px solid var(--tk-border); padding-bottom: 10px; }
        .profile-name { font-size: 16px; font-weight: 800; margin: 0 0 6px; }
        [hidden] { display: none !important; }
        .stepper { display: flex; align-items: center; gap: 6px; }
        .step-btn {
            width: 28px; height: 28px; border-radius: 50%;
            background: #061e19; color: var(--tk-active-green);
            border: 1.5px solid var(--tk-border);
            font-size: 18px; font-weight: 800; line-height: 1;
            cursor: pointer; display: grid; place-items: center; padding: 0 0 2px;
            transition: border-color .15s;
        }
        .step-btn:hover:not(:disabled) { border-color: var(--tk-active-green); }
        .step-btn:disabled { opacity: .3; cursor: default; }
        #hollowPanel .size-chip { min-width: 46px; padding: 6px 9px; }
        .size-panel { display: grid; gap: 10px; }
        .size-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .size-chip {
            background: #061e19; color: var(--tk-warm-white);
            border: 1.5px solid var(--tk-border); border-radius: 7px;
            padding: 7px 11px; font-size: 12px; font-weight: 700;
            cursor: pointer; white-space: nowrap;
            font-variant-numeric: tabular-nums;
            transition: border-color .15s, background .15s;
        }
        .size-chip:hover:not(:disabled):not(.active) { border-color: rgba(74, 251, 134, 0.6); }
        .size-chip.active { background: var(--tk-active-green); border-color: var(--tk-active-green); color: #061814; }
        .size-chip:disabled { opacity: .35; text-decoration: line-through; cursor: not-allowed; }
        .size-chip.custom { border-style: dashed; }
        .custom-size { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .custom-size label { font-size: 10px; font-weight: 700; color: var(--tk-warm-muted); display: grid; gap: 4px; }
        .custom-size input {
            width: 100%; padding: 8px 10px;
            background: #061814; border: 1.5px solid var(--tk-border); border-radius: 6px;
            font-size: 14px; font-weight: 700; color: var(--tk-active-green); outline: none;
        }
        .custom-size input:focus { border-color: var(--tk-active-green); }
        .size-note { font-size: 11px; color: #ffb35c; line-height: 1.4; }
        .size-note:empty { display: none; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip.grade { background: rgba(255, 142, 20, 0.1); border-color: rgba(255, 142, 20, 0.35); color: #ffb35c; }
        .chip b { font-weight: 800; }
        .chip.warn { background: rgba(255, 90, 90, 0.14); border-color: rgba(255, 110, 110, 0.55); color: #ff9a9a; font-weight: 800; }
        .tab-btn.nonstock:not(.active) { opacity: .7; border-style: dashed; }
        .note { margin: -4px 2px 0; font-size: 10.5px; color: var(--tk-warm-muted); line-height: 1.4; }
        .chip {
            display: inline-block;
            background: rgba(74, 251, 134, 0.12);
            border: 1px solid rgba(74, 251, 134, 0.3);
            color: var(--tk-active-green);
            font-size: 10px; font-weight: 600;
            padding: 2px 8px; border-radius: 4px;
        }

        .slider-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .label-muted { font-size: 11px; font-weight: 700; color: var(--tk-warm-muted); }
        .size-pill {
            background: var(--tk-active-green); color: #061814;
            font-size: 12px; font-weight: 800;
            padding: 3px 11px; border-radius: 12px; white-space: nowrap;
        }
        .slider-range-input {
            --p: 0%;
            width: 100%; height: 10px;
            margin: 16px 0 8px;
            border-radius: 5px;
            background: linear-gradient(90deg, rgba(74,251,134,0.55) 0 var(--p), #14453c var(--p) 100%);
            outline: none;
            -webkit-appearance: none; appearance: none;
            cursor: pointer;
        }
        .slider-range-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px; height: 30px; border-radius: 50%;
            background: var(--tk-active-green);
            border: 3px solid #061814;
            box-shadow: 0 0 12px rgba(74, 251, 134, 0.7);
        }
        .slider-range-input::-moz-range-thumb {
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--tk-active-green);
            border: 3px solid #061814;
            box-shadow: 0 0 12px rgba(74, 251, 134, 0.7);
        }
        .slider-range-input:focus-visible::-webkit-slider-thumb { outline: 2px solid #fff; outline-offset: 2px; }
        /* A címkék pontosan a csúszka állásai alatt (a gomb fél szélességével beljebb) */
        .ticks { position: relative; height: 18px; margin: 0 15px; }
        .ticks span {
            position: absolute; top: 0;
            transform: translateX(-50%);
            font-size: 10px; color: var(--tk-warm-muted);
            cursor: pointer; white-space: nowrap;
            padding: 0 2px;
            transition: color .15s;
        }
        .ticks span:hover { color: var(--tk-warm-white); }
        .ticks span.on { color: var(--tk-active-green); font-weight: 800; }
        .ticks span.minor { visibility: hidden; }

        .calc-body { display: grid; gap: var(--gap); }
        .drawing { margin: 0; text-align: center; }
        .svg-container {
            width: 100%; height: 170px;
            display: flex; align-items: center; justify-content: center;
            background: #071f1a;
            border: 1px solid #143d34;
            border-radius: 8px;
        }
        .drawing figcaption { font-size: 10px; color: var(--tk-warm-muted); margin-top: 6px; }

        .section-title {
            margin: 0 0 10px;
            font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: .4px;
            color: var(--tk-active-green);
            border-bottom: 1px solid var(--tk-border);
            padding-bottom: 6px;
        }
        .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .slot-item {
            background: #09241f;
            border: 1px solid var(--tk-border);
            border-radius: 8px;
            padding: 9px 10px;
            display: flex; flex-direction: column; justify-content: center; gap: 6px;
        }
        .slot-label { font-size: 10px; font-weight: 600; color: var(--tk-warm-muted); }
        .cutout-window {
            background: var(--tk-slot-bg);
            border: 1.5px solid #286357;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 15px; font-weight: 800;
            color: var(--tk-active-green);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .unit { font-size: 0.55em; font-weight: 500; color: var(--tk-warm-muted); margin-left: 2px; }

        /* Eredmények */
        .results {
            background: linear-gradient(180deg, #0e352e 0%, #092621 100%);
            border: 2px solid var(--tk-active-green);
            border-radius: var(--radius-md);
            padding: 14px;
            display: grid; gap: 12px;
        }
        .result-box {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            background: #071f1a;
            border: 1px solid var(--tk-border);
            display: flex; flex-direction: column; justify-content: center;
        }
        .result-box.primary { background: linear-gradient(135deg, #0d3830 0%, #154c42 100%); border-color: var(--tk-active-green); }
        .result-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: var(--tk-warm-muted); margin-bottom: 3px; }
        .result-box.primary .result-label { color: var(--tk-active-green); }
        .result-value { font-size: 18px; font-weight: 800; color: var(--tk-active-green); font-variant-numeric: tabular-nums; }
        .result-box.primary .result-value { font-size: 26px; font-weight: 900; color: #fff; }
        .result-box.primary .unit { color: var(--tk-active-green); }
        .cond { font-size: 14px; color: var(--tk-active-green); }
        .qty label { display: block; font-size: 10px; font-weight: 700; margin-bottom: 4px; }
        .qty input {
            width: 100%;
            padding: 9px 10px;
            background: #061814;
            border: 1.5px solid var(--tk-border);
            border-radius: 6px;
            font-size: 15px; font-weight: 700;
            color: var(--tk-active-green);
            outline: none;
            transition: border-color .15s;
        }
        .qty input:focus { border-color: var(--tk-active-green); }
        .total { font-size: 12px; font-weight: 700; margin-top: 8px; text-align: right; }
        .total-value { color: var(--tk-accent-orange); font-size: 15px; font-variant-numeric: tabular-nums; }

        /* Adatbázis */
        .db { display: flex; flex-direction: column; gap: 10px; }
        .db-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .db-head h3 { margin: 0; font-size: 14px; font-weight: 800; }
        .search {
            width: 160px;
            padding: 7px 10px;
            font-size: 12px;
            background: var(--tk-dark-surface);
            color: var(--tk-warm-white);
            border: 1px solid var(--tk-border);
            border-radius: 6px;
            outline: none;
            transition: border-color .15s;
        }
        .search:focus { border-color: var(--tk-active-green); }
        .table-wrap {
            overflow: auto;
            max-height: 340px;
            border: 1px solid var(--tk-border);
            border-radius: 8px;
            background: var(--tk-dark-surface);
            scrollbar-color: #286357 transparent;
            scrollbar-width: thin;
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; white-space: nowrap; }
        th {
            position: sticky; top: 0; z-index: 1;
            background: #07221d;
            color: var(--tk-active-green);
            padding: 10px;
            border-bottom: 1.5px solid var(--tk-border);
        }
        td { padding: 9px 10px; border-bottom: 1px solid #144036; color: var(--tk-warm-white); }
        td.muted { color: var(--tk-warm-muted); }
        td.w { color: var(--tk-active-green); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
        th.w { text-align: right; }
        .db-row { cursor: pointer; transition: background .1s; }
        tr.spacer td, tr.spacer { padding: 0; border: 0; }
        .db-row:hover td { background: #12433a; }
        .db-row.current td { background: rgba(74, 251, 134, 0.14); }
        .db-row.current td:first-child { box-shadow: inset 3px 0 0 var(--tk-active-green); }

        footer {
            background: #051411;
            color: var(--tk-warm-muted);
            padding: 14px 16px;
            font-size: 11px;
            text-align: center;
            border-top: 1px solid var(--tk-border);
        }

        /* ===== Tablet (640 px felett) ===== */
        @media (min-width: 640px) {
            body { padding: 20px; }
            .app { max-width: 920px; }
            .topbar { padding: 18px 24px; }
            .nav { padding: 18px 24px 0; }
            .layout { padding: 18px 24px 24px; gap: 20px; }
            .brand-name { font-size: 20px; }
            .brand-sub { font-size: 12px; }
            .topbar-right { flex-direction: row; align-items: center; gap: 10px; }
            .badge { display: none; }
            .profile-name { font-size: 18px; }
            .calc-body { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
            .drawing.panel, .slots.panel { display: flex; flex-direction: column; }
            .svg-container { flex: 1; min-height: 210px; height: auto; }
            .slot-grid { flex: 1; grid-auto-rows: 1fr; }
            .results { grid-template-columns: 1fr 1fr 1.25fr; align-items: stretch; }
            .result-box.primary .result-value { font-size: 28px; }
            .ticks span { font-size: 11px; }
            .search { width: 220px; }
            .table-wrap { max-height: 420px; }
            table { font-size: 13px; }
        }

        /* ===== Asztali (1200 px felett): kalkulátor + adatbázis egymás mellett ===== */
        @media (min-width: 1200px) {
            body { padding: 28px 32px; }
            .app { max-width: 1680px; }
            .topbar { padding: 20px 32px; }
            .nav { padding: 20px 32px 0; display: grid; gap: 4px; }
            .layout {
                grid-template-columns: minmax(540px, 1.25fr) minmax(450px, 1fr);
                align-items: stretch;
                padding: 22px 32px 32px;
                gap: 24px;
            }
            .card { padding: 20px; }
            /* A táblázat a kalkulátor magasságához igazodik, azon belül görget */
            .db { position: relative; }
            .table-wrap { flex: 1 1 0px; max-height: none; min-height: 0; }
            .svg-container { min-height: 250px; }
            .cutout-window { font-size: 17px; }
        }

        /* Laptopméretnél a Főcsoport oszlop elrejtve, hogy a súly kiférjen */
        @media (min-width: 1200px) and (max-width: 1599px) {
            #masterDbTable th:first-child, #masterDbTable td:first-child { display: none; }
            td, th { padding-left: 8px; padding-right: 8px; }
        }

        /* ===== Széles monitor (1600 px felett) ===== */
        @media (min-width: 1600px) {
            body { font-size: 15px; }
            .profile-name { font-size: 20px; }
            .svg-container { min-height: 290px; }
            .result-box.primary .result-value { font-size: 32px; }
            .result-value { font-size: 20px; }
            .group-btn, .tab-btn { font-size: 13px; padding: 9px 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4afb86" stroke-width="2.2" stroke-linejoin="round">
                    <path d="M4 4h16v3.5h-6v9h6V20H4v-3.5h6v-9H4z"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">tk accelis Materials</div>
                <div class="brand-sub" data-i18n="subtitle">Acélkatalógus & Súlykalibrátor</div>
            </div>
        </div>
        <div class="topbar-right">
            <div class="badge" data-i18n="badge">PRO mobil verzió</div>
            <div class="lang-switch" id="langSwitch">
                <button data-lang="hu">HU</button><button data-lang="de">DE</button><button data-lang="en">EN</button>
            </div>
        </div>
    </header>

    <nav class="nav">
        <div class="group-tabs" id="groupTabs"></div>
        <div class="sub-tabs" id="subTabs"></div>
    </nav>

    <main class="layout">
        <!-- Csúszkás kalkulátor -->
        <section class="card calc">
            <div class="calc-head">
                <h2 class="profile-name" id="devProfileName"></h2>
                <div class="chips" id="devChips"></div>
            </div>

            <div class="panel">
                <div class="slider-head">
                    <span class="label-muted" data-i18n="sizeSelector">Méretválasztó:</span>
                    <div class="stepper">
                        <button class="step-btn" id="stepPrev" aria-label="előző" onclick="stepSlider(-1)">‹</button>
                        <span class="size-pill" id="sliderCurrentLabel"></span>
                        <button class="step-btn" id="stepNext" aria-label="következő" onclick="stepSlider(1)">›</button>
                    </div>
                </div>
                <input type="range" id="profileSlider" class="slider-range-input" min="0" max="0" value="0" oninput="onSliderMove(this.value)">
                <div class="ticks" id="sliderTicks"></div>
            </div>

            <!-- Szélesség és falvastagság (csak zártszelvényeknél) -->
            <div class="panel size-panel" id="hollowPanel" hidden>
                <div id="bRow">
                    <div class="label-muted" id="bLabelEl" data-i18n="bLabel">Szélesség (B):</div>
                    <div class="size-chips" id="bChips"></div>
                </div>
                <div id="wallRow">
                    <div class="label-muted" id="wallLabelEl" data-i18n="wallLabel">Falvastagság (t):</div>
                    <div class="size-chips" id="wallChips"></div>
                </div>
                <div class="size-note" id="openNote"></div>
            </div>

            <!-- Táblaméret-választó (csak lemezeknél) -->
            <div class="panel size-panel" id="sizePanel" hidden>
                <div class="label-muted" data-i18n="sizeLabel">Táblaméret:</div>
                <div class="size-chips" id="sizeChips"></div>
                <div class="custom-size" id="customSize" hidden>
                    <label><span data-i18n="widthMm">Szélesség (mm)</span>
                        <input type="number" id="customW" value="1000" min="1" step="10" inputmode="numeric" oninput="onCustomSize()"></label>
                    <label><span data-i18n="lengthMm">Hosszúság (mm)</span>
                        <input type="number" id="customL" value="2000" min="1" step="10" inputmode="numeric" oninput="onCustomSize()"></label>
                </div>
                <div class="size-note" id="sizeNote"></div>
            </div>

            <div class="calc-body">
                <figure class="drawing panel">
                    <div class="svg-container" id="svgHolder"></div>
                    <figcaption id="svgCaption"></figcaption>
                </figure>
                <div class="slots panel">
                    <h4 class="section-title" data-i18n="dimensions">Méretek</h4>
                    <div class="slot-grid" id="slotsGrid"></div>
                </div>
            </div>

    let currentLang = "hu";
    try { const saved = localStorage.getItem("tkLang"); if (i18n[saved]) currentLang = saved; } catch (e) {}

    const T = key => i18n[currentLang][key];
    const T_ = T;
    const tr = (map, hu) => (currentLang === "hu" || !map) ? hu : (map[currentLang] ?? hu);
    const tGroup = (key, grp) => tr(groupNames[key], grp.groupName);
    const tSubTab = (key, sub) => currentLang === "hu" ? sub.tabLabel : (subNames[key]?.[currentLang]?.[0] ?? sub.tabLabel);
    const tSubName = (key, sub) => currentLang === "hu" ? sub.name : (subNames[key]?.[currentLang]?.[1] ?? sub.name);
    const tCode = code => {
        if (currentLang === "hu") return code;
        const d = { de: { "Kör": "Rund", "Lapos": "Flach" }, en: { "Kör": "Round", "Lapos": "Flat" } }[currentLang];
        return code.replace(/^(Kör|Lapos)\b/, m => d[m]);
    };
    // Tizedesjel: HU/DE vessző, EN pont
    const num = (n, dec) => {
        const s = dec === undefined ? String(n) : n.toFixed(dec);
        return currentLang === "en" ? s : s.replace('.', ',');
    };

    function setLanguage(lang) {
        currentLang = lang;
        try { localStorage.setItem("tkLang", lang); } catch (e) {}
        applyStaticTexts();
        renderGroupTabs();
        loadSubTabs();
        const qty = document.getElementById("lengthInput").value;
        loadProfile(currentGroupKey, currentSubKey, currentIndex);
        document.getElementById("lengthInput").value = qty;   // a beírt hossz megmarad
        calculateSubtotal();
        buildMasterTable();
        filterMasterTable();
        markCurrentRow();
    }

    function applyStaticTexts() {
        document.documentElement.lang = currentLang;
        document.title = T("title");
        document.querySelectorAll("[data-i18n]").forEach(el => el.innerText = T(el.dataset.i18n));
        document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T(el.dataset.i18nPh));
        document.querySelectorAll("#langSwitch button").forEach(b => b.classList.toggle("active", b.dataset.lang === currentLang));
    }

    let currentGroupKey = "tartok";
    let currentSubKey = "hea";
    let currentIndex = 0;
    let currentSize = null;      // lemeznél: "1000×2000" vagy "custom"
    let currentWeight = 0;       // az aktuális tétel súlya (kg/m vagy kg/tábla) a részösszeghez
    const isPlate = sub => sub.kind === "plate";
    const isHollow = sub => sub.kind === "hollow";
    const isOpen = sub => sub.kind === "open";
    const SPEC_TICK = { Z: "Z", SIGMA: "Σ", PAS: "PAS", DS9: "DS-9", HAT: "Ω", RS6: "RS6", P1: "P-I", P2: "P-II" };
    let currentB = null;         // téglalap zártszelvénynél a választott B
    let currentWall = null;      // zártszelvénynél a választott falvastagság

    function init() {
        document.querySelectorAll("#langSwitch button").forEach(b => b.onclick = () => setLanguage(b.dataset.lang));
        applyStaticTexts();
        renderGroupTabs();
        loadSubTabs();
        loadProfile(currentGroupKey, currentSubKey, 0);
        buildMasterTable();
        markCurrentRow();
    }

    function renderGroupTabs() {
        const container = document.getElementById("groupTabs");
        container.innerHTML = "";
        for (const [key, grp] of Object.entries(catalogData)) {
            const btn = document.createElement("button");
            btn.className = `group-btn ${key === currentGroupKey ? 'active' : ''}`;
            btn.innerText = tGroup(key, grp);
            btn.onclick = () => switchGroup(key);
            container.appendChild(btn);
        }
    }

    function switchGroup(groupKey) {
        currentGroupKey = groupKey;
        const subKeys = Object.keys(catalogData[groupKey].subProfiles);
        currentSubKey = subKeys[0];
        currentIndex = 0;
        currentSize = null;
        currentB = null; currentWall = null;
        renderGroupTabs();
        loadSubTabs();
        loadProfile(currentGroupKey, currentSubKey, 0);
    }

    function loadSubTabs() {
        const container = document.getElementById("subTabs");
        container.innerHTML = "";
        const subProfiles = catalogData[currentGroupKey].subProfiles;
        for (const [key, sub] of Object.entries(subProfiles)) {
            const btn = document.createElement("button");
            btn.className = `tab-btn ${key === currentSubKey ? 'active' : ''}${sub.nonStock ? ' nonstock' : ''}`;
            if (sub.nonStock) btn.title = T("nonStock");
            btn.innerText = tSubTab(key, sub);
            btn.onclick = () => switchSub(key);
            container.appendChild(btn);
        }
    }

    function switchSub(subKey) {
        currentSubKey = subKey;
        currentIndex = 0;
        currentSize = null;
        currentB = null; currentWall = null;
        loadSubTabs();
        loadProfile(currentGroupKey, subKey, 0);
    }

    function loadProfile(groupKey, subKey, index) {
        const sub = catalogData[groupKey].subProfiles[subKey];
        currentIndex = index;

        document.getElementById("devProfileName").innerText = tSubName(subKey, sub);
        document.getElementById("calcQtyLabel").innerText = T(isPlate(sub) ? "qtyPieces" : "qtyLabel");
        document.getElementById("lengthInput").value = sub.defaultQty || 6.0;
        document.getElementById("lengthInput").step = isPlate(sub) ? 1 : 0.5;
        document.getElementById("sizePanel").hidden = !isPlate(sub);
        document.getElementById("hollowPanel").hidden = !(isHollow(sub) || isOpen(sub));

        const slider = document.getElementById("profileSlider");
        slider.min = 0;
        slider.max = sub.items.length - 1;
        slider.value = index;

        const ticks = document.getElementById("sliderTicks");
        ticks.innerHTML = "";
        const n = sub.items.length;
        sub.items.forEach((item, idx) => {
            const span = document.createElement("span");
            if (isPlate(sub)) {
                span.innerText = num(item.t);
            } else if (isHollow(sub)) {
                span.innerText = num(item.h);
            } else if (isOpen(sub)) {
                span.innerText = sub.shape === "SPEC" ? SPEC_TICK[item.key] : num(item.h);
            } else {
                const m = item.code.match(/\d+(\.\d+)?/);
                span.innerText = m ? m[0] : item.code;
            }
            span.style.left = (n > 1 ? idx / (n - 1) * 100 : 50) + "%";
            span.onclick = () => { slider.value = idx; onSliderMove(idx); };
            ticks.appendChild(span);
        });
        layoutTicks();

        renderCurrentItem();
    }

    function renderChips(sub, grades) {
        const chips = [];
        if (sub.tolerance) {
            chips.push(`<span class="chip"><b>${T("stdLabel")}:</b> ${sub.standard}</span>`);
            chips.push(`<span class="chip"><b>${T("tolLabel")}:</b> ${sub.tolerance}</span>`);
        } else {
            chips.push(`<span class="chip">${sub.standard}</span>`);
        }
        if (grades) chips.push(`<span class="chip grade"><b>${T("gradeLabel")}:</b> ${grades}</span>`);
        document.getElementById("devChips").innerHTML = chips.join("");
    }

    function onSliderMove(val) {
        currentIndex = parseInt(val, 10);
        renderCurrentItem();
    }

    // Szűk képernyőn minden második címke elrejtve, hogy ne lógjanak egymásba
    function layoutTicks() {
        const ticks = document.getElementById("sliderTicks");
        const spans = [...ticks.children];
        const n = spans.length;
        spans.forEach(s => s.classList.remove("minor"));
        if (n < 2) return;
        const widest = Math.max(...spans.map(s => s.offsetWidth));
        const gap = ticks.clientWidth / (n - 1);
        const step = Math.ceil((widest + 6) / gap);
        if (step > 1) {
            spans.forEach((s, i) => {
                const keep = i % step === 0 || i === n - 1;
                // az utolsó előtti látható címke ne lógjon rá az utolsóra
                const tooClose = i !== n - 1 && i % step === 0 && (n - 1 - i) < step;
                if (!keep || tooClose) s.classList.add("minor");
            });
        }
    }
    window.addEventListener("resize", layoutTicks);

    function renderCurrentItem() {
        const sub = catalogData[currentGroupKey].subProfiles[currentSubKey];
        const item = sub.items[currentIndex];
        const unit = sub.unit || "kg/m";

        if (isPlate(sub)) {
            renderPlate(sub, item);
        } else if (isHollow(sub)) {
            renderHollow(sub, item);
        } else if (isOpen(sub)) {
            renderOpen(sub, item);
        } else {
            renderSection(sub, item, unit);
        }
        calculateSubtotal();

        const slider = document.getElementById("profileSlider");
        const max = sub.items.length - 1;
        slider.style.setProperty("--p", (max > 0 ? currentIndex / max * 100 : 0) + "%");
        [...document.getElementById("sliderTicks").children].forEach((s, i) => s.classList.toggle("on", i === currentIndex));
        document.getElementById("stepPrev").disabled = currentIndex <= 0;
        document.getElementById("stepNext").disabled = currentIndex >= max;
        markCurrentRow();
    }

    function stepSlider(d) {
        const slider = document.getElementById("profileSlider");
        const v = Math.min(Math.max(currentIndex + d, 0), parseInt(slider.max, 10));
        slider.value = v;
        onSliderMove(v);
    }

    // ===== Zártszelvények: méret (csúszka) × [szélesség] × falvastagság =====
    // Keresztmetszet EN 10219-2 (hideg) / EN 10210-2 (meleg) szerint; tömeg = A · 7,85 kg/dm³
    function hollowCalc(sub, H, B, T) {
        let A, ro = null;
        if (sub.shape === "CHS") {
            A = Math.PI * T * (H - T);
        } else if (sub.shape === "ELL") {
            A = Math.PI * T * (H + B - 2 * T) / 2;
        } else {
            let ri;
            if (sub.process === "hot") { ro = 1.5 * T; ri = 1.0 * T; }
            else { ro = T <= 6 ? 2 * T : T <= 10 ? 2.5 * T : 3 * T; ri = ro - T; }
            A = 2 * T * (B + H - 2 * T) - (4 - Math.PI) * (ro * ro - ri * ri);
        }
        return { A: A / 100, weight: A * 0.00785, ro };   // cm², kg/m, mm
    }

    // Precíziós csöveknél a katalógus súlya, egyébként a szabványos képlet
    function hollowWeight(sub, variant, H, B, T) {
        if (!sub.catalogWeights) return hollowCalc(sub, H, B, T);
        const weight = variant.wt[variant.w.indexOf(T)];
        return { A: weight / 0.785, weight, ro: null };
    }

    // A legközelebbi elérhető értéket választja (pl. ha az új méretnél nincs meg a korábbi falvastagság)
    const nearest = (list, v) => (v == null || !list.length) ? list[0] :
        list.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a);

    function chipRow(boxId, values, current, fmtFn, onPick) {
        const box = document.getElementById(boxId);
        box.innerHTML = "";
        values.forEach(v => {
            const b = document.createElement("button");
            b.className = "size-chip" + (v === current ? " active" : "");
            b.innerText = fmtFn(v);
            b.onclick = () => onPick(v);
            box.appendChild(b);
        });
    }

    function hollowCode(sub, H, B, T) {
        if (sub.shape === "CHS") return `Ø ${num(H)} × ${num(T)}`;
        return `${num(H)} × ${num(B)} × ${num(T)}`;
    }

    // ===== Nyitott (hidegen hajlított) profilok: méret (csúszka) × [szár] × anyagvastagság, katalógus szerinti súllyal =====
    function openCode(sub, item, b, t) {
        const pre = { U: "U", C: "C", L: "L", Lu: "L", REG: "RP" }[sub.shape];
        if (sub.shape === "SPEC") return tr(valueNames[item.name], item.name);
        if (sub.shape === "L") return `${pre} ${num(item.h)}×${num(item.h)}×${num(t)}`;
        return `${pre} ${num(item.h)}×${b.split("×").map(x => num(parseFloat(x))).join("×")}×${num(t)}`;
    }

    function renderOpen(sub, item) {
        const spec = sub.shape === "SPEC";
        const bs = item.v.map(v => v.b);
        currentB = bs.includes(currentB) ? currentB : bs[0];
        const variant = item.v.find(v => v.b === currentB);
        const walls = Object.keys(variant.w).map(Number).sort((a, b) => a - b);
        currentWall = walls.includes(currentWall) ? currentWall : nearest(walls, currentWall);
        const T = currentWall, weight = variant.w[String(T)];
        currentWeight = weight;

        const showB = !spec && sub.shape !== "L";
        document.getElementById("bRow").hidden = !showB;
        document.getElementById("wallRow").hidden = spec;
        document.getElementById("bLabelEl").innerText = T_({ U: "bU", C: "bC", Lu: "bLu", REG: "bREG" }[sub.shape] || "bLabel");
        document.getElementById("wallLabelEl").innerText = T_("thickLabel");
        if (showB) chipRow("bChips", bs, currentB, v => v.split("×").map(x => num(parseFloat(x))).join("×"), v => { currentB = v; renderCurrentItem(); });
        chipRow("wallChips", walls, currentWall, v => num(v), v => { currentWall = v; renderCurrentItem(); });
        document.getElementById("openNote").innerText = variant.agree ? T_("agree") : "";

        renderChips(sub, sub.grades);
        if (sub.nonStock) document.getElementById("devChips").insertAdjacentHTML("afterbegin",
            `<span class="chip warn">${T_("nonStock")}</span>`);
        if (variant.len) document.getElementById("devChips").insertAdjacentHTML("beforeend",
            `<span class="chip"><b>${T_("lenOpen")}:</b> ${variant.len.replace(/\./g, ",")}</span>`);
        document.getElementById("unitWeightLabel").innerText = T_("weight");
        document.getElementById("sliderCurrentLabel").innerText = spec
            ? tr(valueNames[item.name], item.name)
            : sub.shape === "L" ? `${num(item.h)} × ${num(item.h)}` : `${num(item.h)} × ${currentB.split("×").map(x => num(parseFloat(x))).join("×")}`;
        document.getElementById("weightDisplay").innerHTML = `${num(weight, 2)}<span class="unit">kg/m</span>`;
        document.getElementById("secondMetricLabel").innerText = T_("areaCalc");
        document.getElementById("areaDisplay").innerHTML = `${num(weight / 0.785, 2)}<span class="unit">cm²</span>`;

        const [b, c] = currentB.split("×").map(parseFloat);
        let slots;
        if (spec) {
            slots = Object.entries(item.dims).map(([k, v]) => [k === "g" ? T_("thickG") : k, num(v), "mm"]);
        } else if (sub.shape === "L") {
            slots = [[T_("legA"), num(item.h), "mm"], [T_("legB"), num(item.h), "mm"], [T_("thickG"), num(T), "mm"]];
        } else if (sub.shape === "Lu") {
            slots = [[T_("legA"), num(item.h), "mm"], [T_("legB"), num(b), "mm"], [T_("thickG"), num(T), "mm"]];
        } else {
            slots = [[T_("webA"), num(item.h), "mm"], [T_("legB"), num(b), "mm"]];
            if (sub.shape === "C") slots.push([T_("lipC"), num(c), "mm"]);
            slots.push([T_("thickG"), num(T), "mm"]);
        }
        document.getElementById("slotsGrid").innerHTML = slots.map(([l, v, u]) =>
            `<div class="slot-item"><div class="slot-label">${l}</div><div class="cutout-window">${v} <span class="unit">${u}</span></div></div>`).join("");

        const dimsForDraw = spec ? { ...item.dims } : { a: item.h, b: sub.shape === "L" ? item.h : b, c: sub.shape === "REG" ? b * 0.3 : c, t: T };
        drawSvgProfile("OPEN", { code: openCode(sub, item, currentB, T), shape: sub.shape, key: item.key, ...dimsForDraw });
    }

    function renderHollow(sub, item) {
        const isRect = sub.shape === "RECT";
        const bs = item.v.map(v => v.b);
        currentB = isRect ? (bs.includes(currentB) ? currentB : nearest(bs, currentB)) : item.v[0].b;
        const variant = item.v.find(v => v.b === currentB);
        const walls = variant.w;
        currentWall = walls.includes(currentWall) ? currentWall : nearest(walls, currentWall);

        document.getElementById("bRow").hidden = !isRect;
        document.getElementById("wallRow").hidden = false;
        document.getElementById("openNote").innerText = "";
        document.getElementById("bLabelEl").innerText = T_("bLabel");
        document.getElementById("wallLabelEl").innerText = T_("wallLabel");
        if (isRect) chipRow("bChips", bs, currentB, v => num(v), v => { currentB = v; renderCurrentItem(); });
        chipRow("wallChips", walls, currentWall, v => num(v), v => { currentWall = v; renderCurrentItem(); });

        const H = item.h, B = currentB ?? item.h, T = currentWall;
        const c = hollowWeight(sub, variant, H, B, T);
        currentWeight = c.weight;

        renderChips(sub, sub.grades);
        if (sub.lengths) document.getElementById("devChips").insertAdjacentHTML("beforeend",
            `<span class="chip"><b>${T_("lenLabel")}:</b> ${sub.lengths}</span>`);
        if (sub.surface) document.getElementById("devChips").insertAdjacentHTML("beforeend",
            `<span class="chip" title="${T_("surfaceHelp")}"><b>${T_("surfaceLabel")}:</b> ${sub.surface}</span>`);
        document.getElementById("unitWeightLabel").innerText = T_("weight");
        document.getElementById("sliderCurrentLabel").innerText =
            sub.shape === "CHS" ? `Ø ${num(H)}` : `${num(H)} × ${num(isRect ? B : item.b ?? H)}`;
        document.getElementById("weightDisplay").innerHTML = `${num(c.weight, sub.catalogWeights ? 3 : 2)}<span class="unit">kg/m</span>`;
        document.getElementById("secondMetricLabel").innerText = T_(sub.catalogWeights ? "areaCalc" : "areaA");
        document.getElementById("areaDisplay").innerHTML = `${num(c.A, 2)}<span class="unit">cm²</span>`;

        const slots = sub.shape === "CHS"
            ? [[T_("dD"), num(H), "mm"], [T_("wallT"), num(T), "mm"]]
            : sub.shape === "ELL"
            ? [[T_("hH"), num(H), "mm"], [T_("bB"), num(B), "mm"], [T_("wallT"), num(T), "mm"]]
            : c.ro == null
            ? [[T_("hH"), num(H), "mm"], [T_("bB"), num(B), "mm"], [T_("wallT"), num(T), "mm"]]
            : [[T_("hH"), num(H), "mm"], [T_("bB"), num(B), "mm"], [T_("wallT"), num(T), "mm"], [T_("roR"), num(Math.round(c.ro * 100) / 100), "mm"]];
        document.getElementById("slotsGrid").innerHTML = slots.map(([l, v, u]) =>
            `<div class="slot-item"><div class="slot-label">${l}</div><div class="cutout-window">${v} <span class="unit">${u}</span></div></div>`).join("");

        const roD = c.ro ?? 1.5 * T, riD = c.ro == null ? 0.5 * T : (sub.process === "hot" ? T : c.ro - T);
        drawSvgProfile("HOLLOW", { code: hollowCode(sub, H, B, T), shape: sub.shape, H, B, T, ro: roD, ri: riD });
    }

    // ===== Lemezek: vastagság (csúszka) × táblaméret =====
    function plateDims(sub, item) {
        if (currentSize === "custom") {
            return {
                W: Math.max(0, parseFloat(document.getElementById("customW").value) || 0),
                L: Math.max(0, parseFloat(document.getElementById("customL").value) || 0)
            };
        }
        const [W, L] = currentSize.split("×").map(Number);
        return { W, L };
    }

    function plateGrades(sub, item, dims) {
        if (sub.tagGrades) {
            const tag = currentSize === "custom" ? "" : (item.avail[currentSize] || "");
            return (sub.tagGrades[tag] || sub.tagGrades[""]).map(g => tr(valueNames[g], g)).join(" · ");
        }
        if (sub.gradeRules) {
            return sub.gradeRules
                .filter(r => item.t >= r.min && item.t <= r.max)
                .filter(r => !r.maxL || dims.L <= r.maxL)
                .filter(r => !r.size || r.size === currentSize)
                .map(r => tr(valueNames[r.g], r.g)).join(" · ");
        }
        return "";
    }

    function renderSizePicker(sub, item) {
        // ha a választott méret ennél a vastagságnál nem raktári, az első elérhetőre ugrik
        if (currentSize !== "custom" && !(currentSize in item.avail)) {
            currentSize = sub.sizes.find(sz => sz in item.avail);
        }
        const box = document.getElementById("sizeChips");
        box.innerHTML = "";
        sub.sizes.forEach(sz => {
            const b = document.createElement("button");
            const ok = sz in item.avail;
            b.className = "size-chip" + (sz === currentSize ? " active" : "");
            b.innerText = sz;
            b.disabled = !ok;
            if (!ok) b.title = T("notStock");
            b.onclick = () => { currentSize = sz; renderCurrentItem(); };
            box.appendChild(b);
        });
        const c = document.createElement("button");
        c.className = "size-chip custom" + (currentSize === "custom" ? " active" : "");
        c.innerText = T("custom");
        c.onclick = () => { currentSize = "custom"; renderCurrentItem(); };
        box.appendChild(c);
        document.getElementById("customSize").hidden = currentSize !== "custom";
    }

    function onCustomSize() { renderCurrentItem(); }

    function renderPlate(sub, item) {
        renderSizePicker(sub, item);
        const dims = plateDims(sub, item);
        const area = dims.W * dims.L / 1e6;                 // m²
        const perM2 = item.t * sub.factor;                   // kg/m²
        currentWeight = area * perM2;                        // kg/tábla

        renderChips(sub, plateGrades(sub, item, dims));
        document.getElementById("sliderCurrentLabel").innerText = `${num(item.t)} mm`;
        document.getElementById("unitWeightLabel").innerText = T("sheetWeight");
        document.getElementById("weightDisplay").innerHTML = `${num(currentWeight, 1)}<span class="unit">${T("unitSheet")}</span>`;
        document.getElementById("secondMetricLabel").innerText = T("m2Weight");
        document.getElementById("areaDisplay").innerHTML = `${num(perM2, 2)}<span class="unit">kg/m²</span>`;

        const tag = currentSize === "custom" ? null : item.avail[currentSize];
        document.getElementById("sizeNote").innerText =
            currentSize === "custom" ? T("customNote") : tag === "DC01" ? T("onlyDC01") : tag === "DX51" ? T("onlyDX51") : "";

        const slots = [
            [T("thickness"), num(item.t), "mm"],
            [T("sheetW"), num(dims.W), "mm"],
            [T("sheetL"), num(dims.L), "mm"],
            [T("sheetArea"), num(area, 2), "m²"]
        ];
        document.getElementById("slotsGrid").innerHTML = slots.map(([l, v, u]) =>
            `<div class="slot-item"><div class="slot-label">${l}</div><div class="cutout-window">${v} <span class="unit">${u}</span></div></div>`).join("");

        drawSvgProfile("PLATE", { code: `${num(item.t)} × ${num(dims.W)}×${num(dims.L)} mm`, t: item.t, W: dims.W, L: dims.L });
    }

    // ===== Szelvények (tartók, rudak, zártszelvények) =====
    function renderSection(sub, item, unit) {
        currentWeight = item.weight;
        renderChips(sub, sub.grades);
        document.getElementById("unitWeightLabel").innerText = T("weight");
        document.getElementById("sliderCurrentLabel").innerText = tCode(item.code);
        document.getElementById("weightDisplay").innerHTML = `${num(item.weight, sub.weightDec ?? 2)}<span class="unit">${unit}</span>`;

        if (sub.areaFromWeight) {
            // A katalógus csak elméleti súlyt ad meg: F = G / (7,85 kg/dm³) → cm²
            document.getElementById("secondMetricLabel").innerText = T("areaCalc");
            document.getElementById("areaDisplay").innerHTML = `${num(item.weight / 0.785, 1)}<span class="unit">cm²</span>`;
        } else if (item.F) {
            document.getElementById("secondMetricLabel").innerText = T("area");
            document.getElementById("areaDisplay").innerHTML = `${num(item.F, 2)}<span class="unit">cm²</span>`;
        } else {
            document.getElementById("secondMetricLabel").innerText = T("condition");
            document.getElementById("areaDisplay").innerHTML = `<span class="cond">${item.minoseg ? tr(valueNames[item.minoseg], item.minoseg) : T('standardCond')}</span>`;
        }

        const slotsGrid = document.getElementById("slotsGrid");
        slotsGrid.innerHTML = "";

        sub.fields.forEach(f => {
            const val = item[f.key];
            if (val !== undefined) {
                const div = document.createElement("div");
                div.className = "slot-item";
                div.innerHTML = `
                    <div class="slot-label">${tr(fieldNames[f.label], f.label)}</div>
                    <div class="cutout-window">${typeof val === "number" ? num(val) : tr(valueNames[val], val)} <span class="unit">${f.unit}</span></div>
                `;
                slotsGrid.appendChild(div);
            }
        });

        drawSvgProfile(sub.type, item);
    }

    // Az adatbázisban kiemeli (és a táblázaton belül görgeti) az épp kiválasztott szelvényt
    function markCurrentRow() {
        const sub = catalogData[currentGroupKey].subProfiles[currentSubKey];
        const key = `${currentGroupKey}|${currentSubKey}|${currentIndex}` +
            (isPlate(sub) ? `|${currentSize}` : (isHollow(sub) || isOpen(sub)) ? `|${currentB}|${currentWall}` : "");
        currentKey = key;
        const wrap = document.getElementById("tableWrap");
        const r = rowPos.get(key), vi = r == null ? -1 : view.indexOf(r);
        if (vi >= 0 && wrap) {
            const top = vi * rowH - wrap.clientHeight / 2 + rowH / 2 + rowH;   // +1 sor a fejléc miatt
            wrap.scrollTop = Math.max(0, top);
        }
        renderRows();
    }

    // Méretarányos szelvényrajz: a valós h, b, s, t (mm) értékekből számolva
    function drawSvgProfile(type, item) {
        const holder = document.getElementById("svgHolder");
        const cx = 135, cy = 88, maxW = 150, maxH = 116;
        const r2 = n => Math.round(n * 100) / 100;
        const fmt = n => num(n);
        const shape = `fill="url(#hatch)" stroke="#4afb86" stroke-width="1.6" stroke-linejoin="round"`;
        const shape_ = shape;
        const dimStyle = `stroke="#b8c4bf" stroke-width="0.8"`;
        const txtStyle = `fill="#b8c4bf" font-size="9" font-weight="600" text-anchor="middle"`;

        // Vízszintes méretvonal (felül)
        const dimH = (x1, x2, yFrom, label) => {
            const y = yFrom - 9;
            return `<line x1="${x1}" y1="${yFrom - 2}" x2="${x1}" y2="${y - 3}" ${dimStyle}/>
                    <line x1="${x2}" y1="${yFrom - 2}" x2="${x2}" y2="${y - 3}" ${dimStyle}/>
                    <line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" ${dimStyle} marker-start="url(#arr)" marker-end="url(#arr)"/>
                    <text x="${(x1 + x2) / 2}" y="${y - 3}" ${txtStyle}>${label}</text>`;
        };
        // Függőleges méretvonal (balra)
        const dimV = (y1, y2, xFrom, label) => {
            const x = xFrom - 10;
            return `<line x1="${xFrom - 2}" y1="${y1}" x2="${x - 3}" y2="${y1}" ${dimStyle}/>
                    <line x1="${xFrom - 2}" y1="${y2}" x2="${x - 3}" y2="${y2}" ${dimStyle}/>
                    <line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" ${dimStyle} marker-start="url(#arr)" marker-end="url(#arr)"/>
                    <text x="${x - 4}" y="${(y1 + y2) / 2}" ${txtStyle} transform="rotate(-90 ${x - 4} ${(y1 + y2) / 2})">${label}</text>`;
        };

        let body = "";

        if (type === 'I' || type === 'INP' || type === 'UNP' || type === 'UPE') {
            const { h, b, s, t } = item;
            const sc = Math.min(maxW / b, maxH / h);
            const X = x => r2(cx + x * sc), Y = y => r2(cy + y * sc);
            const hh = h / 2, bb = b / 2, ss = s / 2;
            let d;

            if (type === 'I') {
                // Párhuzamos övű I-szelvény (IPE, HEA, HEB, HEM) gerinc-öv lekerekítéssel
                const r = Math.min(2 * s, (b - s) / 4);
                d = `M${X(-bb)},${Y(-hh)} L${X(bb)},${Y(-hh)} L${X(bb)},${Y(-hh + t)}
                     L${X(ss + r)},${Y(-hh + t)} Q${X(ss)},${Y(-hh + t)} ${X(ss)},${Y(-hh + t + r)}
                     L${X(ss)},${Y(hh - t - r)} Q${X(ss)},${Y(hh - t)} ${X(ss + r)},${Y(hh - t)}
                     L${X(bb)},${Y(hh - t)} L${X(bb)},${Y(hh)} L${X(-bb)},${Y(hh)} L${X(-bb)},${Y(hh - t)}
                     L${X(-ss - r)},${Y(hh - t)} Q${X(-ss)},${Y(hh - t)} ${X(-ss)},${Y(hh - t - r)}
                     L${X(-ss)},${Y(-hh + t + r)} Q${X(-ss)},${Y(-hh + t)} ${X(-ss - r)},${Y(-hh + t)}
                     L${X(-bb)},${Y(-hh + t)} Z`;
            } else if (type === 'INP') {
                // Lejtős övű I-szelvény, 14% belső övhajlás (t az övkinyúlás felénél)
                const dt = 0.14 * (b - s) / 4;
                const tTip = t - dt, tWeb = t + dt;
                d = `M${X(-bb)},${Y(-hh)} L${X(bb)},${Y(-hh)} L${X(bb)},${Y(-hh + tTip)}
                     L${X(ss)},${Y(-hh + tWeb)} L${X(ss)},${Y(hh - tWeb)} L${X(bb)},${Y(hh - tTip)}
                     L${X(bb)},${Y(hh)} L${X(-bb)},${Y(hh)} L${X(-bb)},${Y(hh - tTip)}
                     L${X(-ss)},${Y(hh - tWeb)} L${X(-ss)},${Y(-hh + tWeb)} L${X(-bb)},${Y(-hh + tTip)} Z`;
            } else if (type === 'UPE') {
                // UPE U-szelvény, párhuzamos övek, gerinc-öv lekerekítéssel, gerinc a bal oldalon
                const x0 = -bb, r = Math.min(1.5 * s, (b - s) / 3);
                d = `M${X(x0)},${Y(-hh)} L${X(bb)},${Y(-hh)} L${X(bb)},${Y(-hh + t)}
                     L${X(x0 + s + r)},${Y(-hh + t)} Q${X(x0 + s)},${Y(-hh + t)} ${X(x0 + s)},${Y(-hh + t + r)}
                     L${X(x0 + s)},${Y(hh - t - r)} Q${X(x0 + s)},${Y(hh - t)} ${X(x0 + s + r)},${Y(hh - t)}
                     L${X(bb)},${Y(hh - t)} L${X(bb)},${Y(hh)} L${X(x0)},${Y(hh)} Z`;
            } else {
                // UNP U-szelvény, 8% belső övhajlás, gerinc a bal oldalon
                const dt = 0.08 * (b - s) / 2;
                const tTip = t - dt, tWeb = t + dt;
                const x0 = -bb;
                d = `M${X(x0)},${Y(-hh)} L${X(bb)},${Y(-hh)} L${X(bb)},${Y(-hh + tTip)}
                     L${X(x0 + s)},${Y(-hh + tWeb)} L${X(x0 + s)},${Y(hh - tWeb)} L${X(bb)},${Y(hh - tTip)}
                     L${X(bb)},${Y(hh)} L${X(x0)},${Y(hh)} Z`;
            }
            body = `<path d="${d}" ${shape}/>` +
                   dimH(X(-bb), X(bb), Y(-hh), `b = ${fmt(b)}`) +
                   dimV(Y(-hh), Y(hh), X(-bb), `h = ${fmt(h)}`);

        } else if (type === 'OPEN') {
            const sh = item.shape === 'SPEC' ? (item.key === 'Z' ? 'Z' : 'SPEC') : item.shape;
            if (sh === 'SPEC') {
                body = `<rect x="${cx - 70}" y="${cy - 28}" width="140" height="56" rx="10" fill="#0f3a32" stroke="#4afb86" stroke-width="1.4" stroke-dasharray="5 3"/>
                        <text x="${cx}" y="${cy + 5}" fill="#4afb86" font-size="13" font-weight="800" text-anchor="middle">${SPEC_TICK[item.key] || ''}</text>`;
            } else {
                // a = függőleges méret, b = vízszintes; t a valós vastagság, de min. 1,6 px
                const a = sh === 'Z' ? item.h : item.a, b = sh === 'Z' ? Math.max(item.a, item.b) : item.b, t0 = sh === 'Z' ? item.g : item.t;
                const W = sh === 'Z' ? item.a + item.b : b;
                const sc = Math.min(maxW / W, maxH / a), t = Math.max(t0 * sc, 1.6);
                const w = W * sc, h = a * sc, x0 = cx - w / 2, y0 = cy - h / 2, x1 = x0 + w, y1 = y0 + h;
                let d;
                if (sh === 'U' || sh === 'REG' || sh === 'C') {
                    const c = (sh === 'U') ? 0 : Math.max(item.c * sc, t + 2);
                    d = sh === 'U'
                      ? `M${x0},${y0} L${x1},${y0} L${x1},${y0 + t} L${x0 + t},${y0 + t} L${x0 + t},${y1 - t} L${x1},${y1 - t} L${x1},${y1} L${x0},${y1} Z`
                      : `M${x0},${y0} L${x1},${y0} L${x1},${y0 + c} L${x1 - t},${y0 + c} L${x1 - t},${y0 + t} L${x0 + t},${y0 + t} L${x0 + t},${y1 - t} L${x1 - t},${y1 - t} L${x1 - t},${y1 - c} L${x1},${y1 - c} L${x1},${y1} L${x0},${y1} Z`;
                } else if (sh === 'L' || sh === 'Lu') {
                    d = `M${x0},${y0} L${x0 + t},${y0} L${x0 + t},${y1 - t} L${x1},${y1 - t} L${x1},${y1} L${x0},${y1} Z`;
                } else { // Z
                    const xm = x0 + item.b * sc, c = Math.max(item.c * sc, t + 2);
                    d = `M${xm},${y0} L${x1},${y0} L${x1},${y0 + c} L${x1 - t},${y0 + c} L${x1 - t},${y0 + t} L${xm + t},${y0 + t} L${xm + t},${y1} L${x0},${y1} L${x0},${y1 - c} L${x0 + t},${y1 - c} L${x0 + t},${y1 - t} L${xm},${y1 - t} Z`;
                }
                body = `<path d="${d}" ${shape_}/>` +
                       dimH(x0, x1, y0, `${sh === 'L' || sh === 'Lu' ? 'b' : sh === 'Z' ? 'a+b' : 'b'} = ${fmt(sh === 'Z' ? item.a + item.b : b)}`) +
                       dimV(y0, y1, x0, `${sh === 'Z' ? 'h' : 'a'} = ${fmt(a)}`);
            }
        } else if (type === 'HOLLOW') {
            const { shape, H, B, T, ro, ri } = item;
            if (shape === 'CHS') {
                const R = maxH / 2 - 4, w = Math.max(T / H * 2 * R, 1.6);
                body = `<circle cx="${cx}" cy="${cy}" r="${R}" ${shape_}/>` +
                       `<circle cx="${cx}" cy="${cy}" r="${R - w}" fill="#071f1a" stroke="#4afb86" stroke-width="1.2"/>` +
                       dimH(cx - R, cx + R, cy - R, `Ø ${fmt(H)}`);
            } else if (shape === 'ELL') {
                const sc = Math.min(maxW / H, maxH / B), rx = H * sc / 2, ry = B * sc / 2, w = Math.max(T * sc, 1.6);
                body = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${shape_}/>` +
                       `<ellipse cx="${cx}" cy="${cy}" rx="${rx - w}" ry="${ry - w}" fill="#071f1a" stroke="#4afb86" stroke-width="1.2"/>` +
                       dimH(cx - rx, cx + rx, cy - ry, `H = ${fmt(H)}`) + dimV(cy - ry, cy + ry, cx - rx, `B = ${fmt(B)}`);
            } else {
                const sc = Math.min(maxW / H, maxH / B), w = H * sc, hgt = B * sc;
                const x = cx - w / 2, y = cy - hgt / 2, t = Math.max(T * sc, 1.6);
                body = `<rect x="${x}" y="${y}" width="${w}" height="${hgt}" rx="${ro * sc}" ${shape_}/>` +
                       `<rect x="${x + t}" y="${y + t}" width="${w - 2 * t}" height="${hgt - 2 * t}" rx="${Math.max(ri * sc, 0)}" fill="#071f1a" stroke="#4afb86" stroke-width="1.2"/>` +
                       dimH(x, x + w, y, `H = ${fmt(H)}`) + dimV(y, y + hgt, x, `B = ${fmt(B)}`);
            }
        } else if (type === 'PLATE') {
            const { W, L, t } = item;
            if (W > 0 && L > 0) {
                // hosszabb oldal vízszintesen
                const horizW = L >= W, a = horizW ? L : W, c = horizW ? W : L;
                const sc = Math.min(maxW / a, (maxH - 18) / c);
                const w = a * sc, hgt = c * sc, x = cx - w / 2, y = cy - 9 - hgt / 2;
                body = `<rect x="${x}" y="${y}" width="${w}" height="${hgt}" ${shape}/>` +
                       dimH(x, x + w, y, `${horizW ? 'L' : 'W'} = ${fmt(a)}`) +
                       dimV(y, y + hgt, x, `${horizW ? 'W' : 'L'} = ${fmt(c)}`) +
                       `<text x="${cx}" y="${y + hgt + 16}" fill="#ff8e14" font-size="10" font-weight="700" text-anchor="middle">t = ${fmt(t)} mm</text>`;
            }
        } else if (type === 'RS') {
            const R = maxH / 2 - 4;
            body = `<circle cx="${cx}" cy="${cy}" r="${R}" ${shape}/>` +
                   `<line x1="${cx - R - 6}" y1="${cy}" x2="${cx + R + 6}" y2="${cy}" stroke="#ff8e14" stroke-width="0.7" stroke-dasharray="6 2 1 2"/>` +
                   `<line x1="${cx}" y1="${cy - R - 2}" x2="${cx}" y2="${cy + R + 6}" stroke="#ff8e14" stroke-width="0.7" stroke-dasharray="6 2 1 2"/>` +
                   dimH(cx - R, cx + R, cy - R, `Ø ${fmt(item.d)}`);

        } else if (type === 'BOX') {
            const sc = maxH / item.a;
            const A = item.a * sc, S = Math.max(item.s * sc, 2);
            const x = cx - A / 2, y = cy - A / 2;
            body = `<rect x="${x}" y="${y}" width="${A}" height="${A}" rx="${Math.max(2 * S, 3)}" ${shape}/>` +
                   `<rect x="${x + S}" y="${y + S}" width="${A - 2 * S}" height="${A - 2 * S}" rx="${S}" fill="#071f1a" stroke="#4afb86" stroke-width="1.2"/>` +
                   dimH(x, x + A, y, `a = ${fmt(item.a)}`) +
                   dimV(y, y + A, x, `a = ${fmt(item.a)}`);

        } else if (type === 'FLAT') {
            const sc = Math.min(maxW / item.a, maxH / item.b);
            const W = item.a * sc, H = item.b * sc;
            const x = cx - W / 2, y = cy - H / 2;
            body = `<rect x="${x}" y="${y}" width="${W}" height="${H}" ${shape}/>` +
                   dimH(x, x + W, y, `a = ${fmt(item.a)}`) +
                   dimV(y, y + H, x, `b = ${fmt(item.b)}`);
        }

        holder.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 240 160" preserveAspectRatio="xMidYMid meet">
            <defs>
                <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <rect width="6" height="6" fill="#0f3a32"/>
                    <line x1="0" y1="0" x2="0" y2="6" stroke="#4afb86" stroke-width="1" opacity="0.55"/>
                </pattern>
                <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M0,1 L10,5 L0,9 z" fill="#b8c4bf"/>
                </marker>
            </defs>${body}</svg>`;
        document.getElementById("svgCaption").innerText = tCode(item.code) + " – " + T(type === "PLATE" ? "plateView" : "caption");
    }

    function calculateSubtotal() {
        const qty = parseFloat(document.getElementById("lengthInput").value) || 0;
        const total = currentWeight * qty;
        document.getElementById("subtotalWeight").innerText = num(total, 2) + " kg";
    }

    // A táblázat egyetlen HTML-szövegként épül (több ezer sornál ez sokkal gyorsabb),
    // a kattintást egy közös kezelő fogadja, a kiemeléshez és kereséshez index készül.
    // Virtuális görgetés: az összes sor adata memóriában van, de csak a látható sávot rajzoljuk ki.
    let rowKeys = [], rowCells = [], rowNorm = [], rowPos = new Map(), view = [], rowH = 36, currentKey = "";
    function addRow(tbody, gKey, grp, sKey, sub, idx, size, sizeText, weightText) {
        const key = `${gKey}|${sKey}|${idx}` + (size == null ? "" : typeof size === "object" ? `|${size.b}|${size.t}` : `|${size}`);
        const cells = `<td><b>${tGroup(gKey, grp)}</b></td><td>${tSubTab(sKey, sub)}</td><td class="muted">${sub.standard}</td><td><b>${sizeText}</b></td><td class="w">${weightText}</td>`;
        rowKeys.push(key); rowCells.push(cells);
        rowNorm.push(norm(`${tGroup(gKey, grp)} ${tSubTab(sKey, sub)} ${sub.standard} ${sizeText} ${weightText}`));
    }

    function renderRows() {
        const wrap = document.getElementById("tableWrap"), tbody = document.getElementById("masterTableBody");
        const visible = Math.ceil((wrap.clientHeight || 400) / rowH) + 1, buf = 12;
        const start = Math.max(0, Math.floor(wrap.scrollTop / rowH) - buf);
        const end = Math.min(view.length, start + visible + 2 * buf);
        let html = start > 0 ? `<tr class="spacer" style="height:${start * rowH}px"></tr>` : "";
        for (let i = start; i < end; i++) {
            const r = view[i];
            html += `<tr class="db-row${rowKeys[r] === currentKey ? " current" : ""}" data-key="${rowKeys[r]}">${rowCells[r]}</tr>`;
        }
        if (end < view.length) html += `<tr class="spacer" style="height:${(view.length - end) * rowH}px"></tr>`;
        tbody.innerHTML = html;
        // a tényleges sormagasság mérése (betűméret / képernyő szerint), és újrarajzolás, ha eltér
        const first = tbody.querySelector("tr.db-row");
        if (first && Math.abs(first.offsetHeight - rowH) > 0.5) { rowH = first.offsetHeight; renderRows(); }
    }

    function onTableClick(e) {
        const tr = e.target.closest("tr.db-row");
        if (!tr) return;
        const [g, s, i, ...rest] = tr.dataset.key.split("|");
        const sub = catalogData[g].subProfiles[s];
        let opt = null;
        if (isPlate(sub)) opt = rest[0];
        else if (isHollow(sub)) opt = { b: rest[0] === "null" ? null : Number(rest[0]), t: Number(rest[1]) };
        else if (isOpen(sub)) opt = { b: rest[0], t: Number(rest[1]) };
        openFromTable(g, s, Number(i), opt);
    }

    function buildMasterTable() {
        const tbody = document.getElementById("masterTableBody");
        rowKeys = []; rowCells = []; rowNorm = [];
        for (const [gKey, grp] of Object.entries(catalogData)) {
            for (const [sKey, sub] of Object.entries(grp.subProfiles)) {
                sub.items.forEach((item, idx) => {
                    if (isOpen(sub)) {
                        item.v.forEach(v => Object.keys(v.w).map(Number).sort((a, b) => a - b).forEach(t => {
                            addRow(tbody, gKey, grp, sKey, sub, idx, { b: v.b, t },
                                   openCode(sub, item, v.b, t), `${num(v.w[String(t)], 2)} kg/m`);
                        }));
                    } else if (isHollow(sub)) {
                        item.v.forEach(v => v.w.forEach(t => {
                            const c = hollowWeight(sub, v, item.h, v.b ?? item.h, t);
                            addRow(tbody, gKey, grp, sKey, sub, idx, { b: v.b, t },
                                   hollowCode(sub, item.h, v.b ?? item.h, t), `${num(c.weight, sub.catalogWeights ? 3 : 2)} kg/m`);
                        }));
                    } else if (isPlate(sub)) {
                        sub.sizes.filter(sz => sz in item.avail).forEach(sz => {
                            const [W, L] = sz.split("×").map(Number);
                            const w = item.t * sub.factor * W * L / 1e6;
                            addRow(tbody, gKey, grp, sKey, sub, idx, sz,
                                   `${num(item.t)} × ${sz} mm`, `${num(w, 1)} ${T("unitSheet")}`);
                        });
                    } else {
                        addRow(tbody, gKey, grp, sKey, sub, idx, null,
                               tCode(item.code), `${num(item.weight, sub.weightDec ?? 2)} ${sub.unit}`);
                    }
                });
            }
        }
        rowPos = new Map(rowKeys.map((k, i) => [k, i]));
        view = rowKeys.map((_, i) => i);
        tbody.onclick = onTableClick;
        const wrap = document.getElementById("tableWrap");
        if (!wrap._vs) { wrap._vs = true; wrap.addEventListener("scroll", () => requestAnimationFrame(renderRows), { passive: true }); window.addEventListener("resize", () => renderRows()); }
        renderRows();
    }

    // Táblázatsorra kattintva a kalkulátor arra a tételre ugrik
    function openFromTable(gKey, sKey, idx, size) {
        currentGroupKey = gKey;
        currentSubKey = sKey;
        currentSize = typeof size === "string" ? size : null;
        if (size && typeof size === "object") { currentB = size.b; currentWall = size.t; } else { currentB = null; currentWall = null; }
        renderGroupTabs();
        loadSubTabs();
        loadProfile(gKey, sKey, idx);
        if (window.innerWidth < 1200) {
            document.querySelector(".calc").scrollIntoView({ behavior: "smooth", block: "start" });
        }
    }

    // A keresésben az "x" és a "×" egyenértékű (pl. 1500x3000)
    function norm(t) { return t.replace(/<[^>]+>/g, "").toLowerCase().replace(/×/g, "x").replace(/,/g, ".").replace(/ø/g, "").replace(/\s+/g, "").trim(); }
    function filterMasterTable() {
        const query = norm(document.getElementById("dbSearch").value);
        view = [];
        for (let i = 0; i < rowNorm.length; i++) if (!query || rowNorm[i].includes(query)) view.push(i);
        document.getElementById("tableWrap").scrollTop = 0;
        renderRows();
    }

    window.onload = init;
</script>
</body>
</html>
